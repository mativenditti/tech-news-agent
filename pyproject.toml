[project]
name = "tech-news-agent"
version = "0.1.0"
description = "LLM agent (LangChain + LangGraph) that keeps you posted on tech news and produces readable reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Stack en LangChain 1.x. El salto desde 0.3 es necesario para el fix del
    # thought_signature de Gemini 3 (ver langchain-google-genai abajo): la primera
    # versión con ese fix (>=3.1.0) exige langchain-core>=1.0.
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    # >=3.1.0 es donde se arregla el round-trip del thought_signature de Gemini 3
    # (modelos "thinking") en tool-calling multi-turno. Con <3 el server tira
    # "400 Function call is missing a thought_signature" a partir de la 3ra tool call.
    "langchain-google-genai>=4.1.3,<5",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1.0,<2",
    "langchain-tavily>=0.2.0",
    "langchain-postgres>=0.0.12",
    "psycopg[binary]>=3.1",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint>=2.1.0,<5",
    "langsmith>=0.4.0",
    "langserve>=0.3.1,<0.4",
    "sse-starlette>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
