[project]
name = "tech-news-agent"
version = "0.1.0"
description = "LLM agent (LangChain + LangGraph) that keeps you posted on tech news and produces readable reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.27,<0.4",
    "langchain-core>=0.3.72,<0.4",
    "langchain-google-genai>=2.1.0,<3",
    "langchain-community>=0.3.27,<0.4",
    "langchain-text-splitters>=0.3.8,<0.4",
    "langchain-tavily>=0.2.0,<0.3",
    "langchain-chroma>=0.2.0,<0.3",
    "langgraph>=0.6.0,<0.7",
    "langgraph-checkpoint>=2.1.0,<3",
    "langsmith>=0.4.0,<0.5",
    "langserve>=0.3.1,<0.4",
    "sse-starlette>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
