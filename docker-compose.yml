services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tech-news-pgvector
    environment:
      POSTGRES_USER: tech
      POSTGRES_PASSWORD: tech
      POSTGRES_DB: tech_news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tech -d tech_news"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
